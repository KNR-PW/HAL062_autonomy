/**:
  ros__parameters:
    # Lidar settings
    use_lidar: false  # Launch override
    # QoS settings
    # nvblox 5.0 + zed-ros2-wrapper 5.2: with "SENSOR_DATA" the nvblox subscriptions never match the ZED publishers
    # (RELIABLE, subscription count stays 0, no depth/color integration). "SYSTEM_DEFAULT" matches and gives 30 Hz.
    input_qos: "SYSTEM_DEFAULT"
    # Map clearing settings
    map_clearing_frame_id: "rover_2d"
    # Rviz visualization
    esdf_slice_bounds_visualization_attachment_frame_id: "rover_2d"

    # could be manipulated to fit under/over map scenarios

    static_mapper:
      esdf_slice_height: 0.0
      esdf_slice_min_height: 0.2
      esdf_slice_max_height: 1.2

    dynamic_mapper:
      esdf_slice_height: 0.0
      esdf_slice_min_height: 0.2
      esdf_slice_max_height: 1.2
